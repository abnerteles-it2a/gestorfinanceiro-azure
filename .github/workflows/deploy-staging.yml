name: Deploy Staging to Azure Container Apps

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

  deploy:
    name: Build Docker & Deploy to Azure Container Apps
    needs: validate
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & Push Image via Azure Container Registry (ACR)
        run: |
          az acr build \
            --registry acraiopsprodit2a \
            --image gestor-financeiro-staging:${{ github.sha }} \
            .

      - name: Deploy to Azure Container Apps (Staging)
        run: |
          az containerapp update \
            --name ca-gestor-staging \
            --resource-group rg-aiops-prod \
            --image acraiopsprodit2a.azurecr.io/gestor-financeiro-staging:${{ github.sha }}

      - name: Verify deployed image and ready revision
        env:
          EXPECTED_IMAGE: acraiopsprodit2a.azurecr.io/gestor-financeiro-staging:${{ github.sha }}
        run: |
          state=$(az containerapp show --name ca-gestor-staging --resource-group rg-aiops-prod --output json)
          echo "$state" | jq -e --arg image "$EXPECTED_IMAGE" '
            .properties.provisioningState == "Succeeded" and
            .properties.latestRevisionName == .properties.latestReadyRevisionName and
            any(.properties.template.containers[]; .image == $image)
          ' >/dev/null
          echo "$state" | jq '{revision: .properties.latestReadyRevisionName, images: [.properties.template.containers[].image], traffic: .properties.configuration.ingress.traffic}'
